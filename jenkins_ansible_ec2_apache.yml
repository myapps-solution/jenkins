---
- name: Create EC2 & Install Apache on Ubuntu
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "us-east-1"
    ami_id: "ami-0e001c9271cf7f3b9"      # Ubuntu 22.04 LTS
    instance_type: "t3.micro"
    key_name: "Jenkins_master.pem"       # YOUR key pair name (unchanged)
    ssh_user: "ubuntu"                   # Ubuntu user
    ec2_name: "jenkins-demo-ec2"         # unchanged
    sg_name: "jenkins-demo-sg"           # unchanged

  tasks:
    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SG for Jenkins-Ansible Demo"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_out

    - name: Launch EC2 instance (Ubuntu)
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_group: "{{ sg_out.group_id }}"
        region: "{{ region }}"
        wait: yes
        tags:
          Name: "{{ ec2_name }}"
      register: ec2_out

    - name: Debug - show created instances IDs and public IPs
      debug:
        msg:
          - "Created instance ids: {{ ec2_out.instances | map(attribute='id') | list }}"
          - "Created instance public IPs: {{ ec2_out.instances | map(attribute='public_ip_address') | list }}"

    - name: Save instance IP addresses to workspace file (instance_ips.txt)
      copy:
        dest: "./instance_ips.txt"
        content: |
          {% for ip in ec2_out.instances | map(attribute='public_ip_address') | list %}
          {{ ip }}
          {% endfor %}
      delegate_to: localhost

    - name: Add new instance to inventory
      add_host:
        name: "{{ item.public_ip_address }}"
        groups: launched
        ansible_user: "{{ ssh_user }}"
        public_ip: "{{ item.public_ip_address | default('') }}"
      loop: "{{ ec2_out.instances }}"

    - name: Wait for SSH
      wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        timeout: 300
      loop: "{{ ec2_out.instances }}"

- name: Install Apache (Ubuntu)
  hosts: launched
  become: yes
  gather_facts: yes

  tasks:
    - name: Ensure python present (for Ansible facts/modules)
      raw: |
        if command -v python3 >/dev/null 2>&1; then exit 0; fi
        if command -v python >/dev/null 2>&1; then exit 0; fi
        if [ -x /usr/bin/apt-get ]; then
          apt-get update && apt-get install -y python3
        fi
      changed_when: false
      ignore_errors: true

    - name: Install Apache2
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start and enable apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create demo page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Apache deployed using Jenkins + Ansible on Ubuntu!</h1>
          <p>Server: {{ inventory_hostname }}</p>
