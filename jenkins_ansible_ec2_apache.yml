---
# jenkins_ansible_ec2_apache.yml
# Creates an EC2 instance, registers it in inventory, ensures Jenkins controller
# knows the instance SSH host key, then connects and installs Apache.
#
# IMPORTANT:
# - Ensure your Jenkins AWS creds have permissions to create EC2, SG, etc.
# - Ensure the Jenkins SSH credential/private-key corresponds to the AWS KeyPair
#   name you set in key_name (do NOT append ".pem" in the key_name).
# - This playbook runs the AWS API tasks on localhost (where ansible runs inside Jenkins).

- name: Create EC2 & prepare for config
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "us-east-1"
    ami_id: "ami-0e001c9271cf7f3b9"      # Ubuntu 22.04 LTS (example)
    instance_type: "t3.micro"
    key_name: "Jenkins_master"           # AWS KeyPair NAME (no .pem)
    ssh_user: "ubuntu"                   # SSH user for the AMI
    ec2_name: "jenkins-demo-ec2"
    sg_name: "jenkins-demo-sg"
    demo_tag_name: "jenkins-demo-ec2"
    wait_for_ssh_timeout: 300

  tasks:
    - name: Debug - show effective variables
      debug:
        msg:
          - "region={{ region }}"
          - "ami_id={{ ami_id }}"
          - "key_name={{ key_name }}"
          - "instance_type={{ instance_type }}"

    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SG for Jenkins-Ansible Demo"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_out

    - name: Launch EC2 instance (Ubuntu)
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        network:
          security_groups: [ "{{ sg_out.group_id }}" ]
        region: "{{ region }}"
        wait: yes
        wait_timeout: 600
        count: 1
        instance_tags:
          Name: "{{ demo_tag_name }}"
        assign_public_ip: yes
      register: ec2_out

    - name: Debug - show raw ec2_out structure (useful if things still odd)
      debug:
        var: ec2_out

    - name: Normalize instances list into a simple list of dicts (id, public_ip)
      set_fact:
        created_instances: >-
          {{
            ec2_out.instances
            | map('combine', {
                'instance_id': (item.instance_id if (item.instance_id is defined) else (item.id if item.id is defined else '')),
                'public_ip': (item.public_ip_address if (item.public_ip_address is defined) else (item.public_ip if (item.public_ip is defined) else ''))
              })
            | list
          }}
      vars:
        # map() uses `item` in combine expression; kept for clarity
      loop: "{{ ec2_out.instances }}"
      loop_control:
        label: "{{ item.instance_id | default(item.id | default('unknown')) }}"
      when: ec2_out.instances is defined

    - name: Debug - show created instance IDs and public IPs
      debug:
        msg:
          - "Created instance IDs: {{ created_instances | map(attribute='instance_id') | list }}"
          - "Created public IPs: {{ created_instances | map(attribute='public_ip') | list }}"

    - name: Add new instance(s) to inventory (group 'launched')
      add_host:
        name: "{{ item.public_ip }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: ""   # we rely on Jenkins sshagent; keep blank
        groups: launched
      loop: "{{ created_instances }}"
      when: created_instances | length > 0

    - name: Ensure Jenkins controller ~/.ssh exists
      file:
        path: "{{ lookup('env','HOME') }}/.ssh"
        state: directory
        mode: '0700'
      delegate_to: localhost
      run_once: true

    - name: Add launched hosts to Jenkins known_hosts using ssh-keyscan
      delegate_to: localhost
      run_once: true
      vars:
        known_hosts_file: "{{ lookup('env','HOME') }}/.ssh/known_hosts"
      loop: "{{ groups['launched'] | default([]) }}"
      loop_control:
        label: "{{ item }}"
      when: groups['launched'] is defined and groups['launched'] | length > 0
      block:
        - name: Compute host_to_scan
          set_fact:
            host_to_scan: "{{ item }}"
        - name: Ensure we can ssh-keyscan the host and add to known_hosts
          shell: |
            set -e
            KNOWN="{{ known_hosts_file }}"
            HOST="{{ host_to_scan }}"
            # Create known_hosts file if missing
            mkdir -p "$(dirname "$KNOWN")"
            touch "$KNOWN"
            chmod 600 "$KNOWN" || true
            # Remove any existing line for this host to avoid duplicates
            if grep -q -F "$HOST" "$KNOWN" 2>/dev/null; then
              grep -v -F "$HOST" "$KNOWN" > "${KNOWN}.tmp" || true
              mv -f "${KNOWN}.tmp" "$KNOWN"
            fi
            # Append hostkey (retry a couple times in case host is still initializing)
            MAX=6
            COUNT=0
            while [ $COUNT -lt $MAX ]; do
              ssh-keyscan -T 5 -H "$HOST" >> "$KNOWN" && break || true
              COUNT=$((COUNT+1))
              sleep 2
            done
            # show last line for debugging
            tail -n 1 "$KNOWN" || true
          args:
            executable: /bin/bash

    - name: Wait for SSH on newly created instances (by resolved public IP)
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: "{{ wait_for_ssh_timeout }}"
        state: started
      loop: "{{ groups['launched'] | default([]) }}"
      when: groups['launched'] is defined and groups['launched'] | length > 0

    - name: Get instance details (public IP, dns) via ec2_instance_info
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        filters:
          "tag:Name": "{{ demo_tag_name }}"
      register: ec2_info

    - name: Debug - show fetched ec2_info
      debug:
        var: ec2_info

  # end tasks for localhost play

- name: Install Apache (Ubuntu)
  hosts: launched
  become: yes
  gather_facts: yes
  vars:
    # optionally override remote become user if needed (default is root)
  tasks:
    - name: Wait for SSH to be truly ready per host
      wait_for:
        port: 22
        host: "{{ inventory_hostname }}"
        timeout: 60

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install Apache2
      apt:
        name: apache2
        state: present

    - name: Start and enable apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create demo page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Apache deployed using Jenkins + Ansible on Ubuntu!</h1>
          <p>Server: {{ inventory_hostname }}</p>
