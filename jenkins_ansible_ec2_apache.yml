---
- name: Create EC2 & Install Apache on Ubuntu
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "us-east-1"
    ami_id: "ami-0e001c9271cf7f3b9"      # Ubuntu 22.04 LTS
    instance_type: "t3.micro"
    key_name: "Jenkins_master"           # <-- ensure this matches the AWS Key Pair name
    ssh_user: "ubuntu"
    ec2_name: "jenkins-demo-ec2"
    sg_name: "jenkins-demo-sg"

  tasks:
    - name: Debug - show effective variables
      debug:
        msg:
          - "region={{ region }}"
          - "ami_id={{ ami_id }}"
          - "key_name={{ key_name }}"
          - "instance_type={{ instance_type }}"

    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SG for Jenkins-Ansible Demo"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_out

    - name: Launch EC2 instance (Ubuntu)
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_group: "{{ sg_out.group_id }}"
        region: "{{ region }}"
        wait: yes
        tags:
          Name: "{{ ec2_name }}"
      register: ec2_out

    - name: Debug - show raw ec2_out structure (useful if things still odd)
      debug:
        var: ec2_out

    - name: Ensure we have instance IDs from module output
      fail:
        msg: "No instance_ids returned by ec2 module (ec2_out.instance_ids is empty)."
      when: ec2_out.instance_ids is not defined or ec2_out.instance_ids | length == 0

    - name: Get instance details (public IP, dns) via ec2_instance_info
      amazon.aws.ec2_instance_info:
        region: "{{ region }}"
        instance_ids: "{{ ec2_out.instance_ids }}"
      register: ec2_info

    - name: Debug - show fetched ec2_info
      debug:
        var: ec2_info

    - name: Add new instances to inventory (normalized)
      add_host:
        name: "{{ (item.public_ip_address | default(item.public_ip | default(item.PublicIpAddress | default('')))) }}"
        groups: launched
        ansible_user: "{{ ssh_user }}"
        ansible_host: "{{ (item.public_ip_address | default(item.public_ip | default(item.PublicIpAddress | default(''))) ) }}"
        public_ip: "{{ (item.public_ip_address | default(item.public_ip | default(item.PublicIpAddress | default(''))) ) }}"
        public_dns: "{{ (item.public_dns_name | default(item.public_dns | default(item.PublicDnsName | default(''))) ) }}"
      loop: "{{ ec2_info.instances }}"
      when: (item.public_ip_address is defined) or (item.public_ip is defined) or (item.PublicIpAddress is defined) or (item.public_dns_name is defined) or (item.public_dns is defined) or (item.PublicDnsName is defined)

    - name: If add_host loop produced zero hosts -- try fallback using instance_ids
      debug:
        msg: "No public IP found in ec2_info.instances; listing instance_ids: {{ ec2_out.instance_ids }}"
      when: groups['launched'] is not defined or groups['launched'] | length == 0

    - name: Wait for SSH on newly created instances (by public IP)
      wait_for:
        host: "{{ item.public_ip }}"
        port: 22
        timeout: 600
      loop: "{{ groups['launched'] | default([]) }}"
      when: groups['launched'] is defined and groups['launched'] | length > 0

- name: Install Apache (Ubuntu)
  hosts: launched
  become: yes
  gather_facts: yes

  tasks:
    - name: Ensure python is present (for Ansible facts and modules)
      raw: |
        if command -v python3 >/dev/null 2>&1; then exit 0; fi
        if command -v python >/dev/null 2>&1; then exit 0; fi
        if [ -x /usr/bin/apt-get ]; then
          apt-get update && apt-get install -y python3
        fi
      changed_when: false
      ignore_errors: true

    - name: Install Apache2
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: Start and enable apache
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create demo page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Apache deployed using Jenkins + Ansible on Ubuntu!</h1>
          <p>Server: {{ inventory_hostname }}</p>
          <p>Public IP: {{ hostvars[inventory_hostname].public_ip | default('unknown') }}</p>
