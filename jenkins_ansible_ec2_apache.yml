---
- name: Create EC2 & prepare for config (with preflight checks)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "us-east-1"
    ami_id: "ami-0e001c9271cf7f3b9"
    instance_type: "t3.micro"
    key_name: "Jenkins_master"         # AWS keypair name (no .pem)
    ssh_user: "ubuntu"
    ec2_name: "jenkins-demo-ec2"
    sg_name: "jenkins-demo-sg"
    demo_tag_name: "jenkins-demo-ec2"
    subnet_id: ""                      # <--- set this to a valid public subnet id if default subnets absent
    wait_for_ssh_timeout: 300

  tasks:
    - name: Print vars
      debug: var=key_name

    - name: Validate AWS credentials by calling STS
      shell: aws sts get-caller-identity --region "{{ region }}"
      register: sts_info
      failed_when: sts_info.rc != 0
    - name: Show caller
      debug: var=sts_info.stdout

    - name: Validate keypair exists
      shell: aws ec2 describe-key-pairs --key-names "{{ key_name }}" --region "{{ region }}"
      register: kp_check
      failed_when: kp_check.rc != 0
      ignore_errors: false
    - name: Show keypair check
      debug: var=kp_check.stdout

    - name: If subnet_id not provided, attempt to pick a public subnet
      set_fact:
        subnet_id: "{{ subnet_id | default((lookup('pipe','aws ec2 describe-subnets --region ' + region + ' --query \"Subnets[?MapPublicIpOnLaunch==`true`].SubnetId\" --output text') ).split()[0]) }}"
      when: subnet_id == ""

    - name: Fail early if no subnet_id found
      fail:
        msg: "No subnet_id found. Provide a valid subnet_id variable or ensure there is a subnet with MapPublicIpOnLaunch==true in region {{ region }}. Use 'aws ec2 describe-subnets --region {{ region }}'."
      when: subnet_id is undefined or subnet_id == ""

    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SG for Jenkins-Ansible Demo"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_out

    - name: Launch EC2 instance
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        network:
          subnet_id: "{{ subnet_id }}"
          security_groups: ["{{ sg_out.group_id }}"]
          assign_public_ip: yes
        region: "{{ region }}"
        count: 1
        wait: yes
        wait_timeout: 600
        instance_tags:
          Name: "{{ demo_tag_name }}"
      register: ec2_out
      failed_when: ec2_out is failed or (ec2_out.instances | length) == 0
      ignore_errors: false

    - name: Debug ec2_out
      debug: var=ec2_out

    # Continue same post-creation steps as before (normalize, add_host, ssh-keyscan, wait_for, etc.)
    - name: Normalize instances
      set_fact:
        created_instances: >-
          {{
            ec2_out.instances
            | map('combine', {
                'instance_id': (item.instance_id if (item.instance_id is defined) else (item.id if item.id is defined else '')),
                'public_ip': (item.public_ip_address if (item.public_ip_address is defined) else (item.public_ip if item.public_ip is defined else ''))
              })
            | list
          }}
      loop: "{{ ec2_out.instances }}"
      loop_control:
        label: "{{ item.instance_id | default(item.id | default('unknown')) }}"

    - name: Debug created_instances
      debug:
        var: created_instances

    - name: Add to inventory
      add_host:
        name: "{{ item.public_ip }}"
        ansible_user: "{{ ssh_user }}"
        groups: launched
      loop: "{{ created_instances }}"
      when: created_instances | length > 0

    - name: Ensure controller known_hosts and add hosts via ssh-keyscan (same as earlier)
      delegate_to: localhost
      block:
        - file:
            path: "{{ lookup('env','HOME') }}/.ssh"
            state: directory
            mode: '0700'
        - name: Add host keys
          shell: |
            KNOWN="{{ lookup('env','HOME') }}/.ssh/known_hosts"
            HOST="{{ item }}"
            touch "$KNOWN"
            chmod 600 "$KNOWN" || true
            if grep -q -F "$HOST" "$KNOWN" 2>/dev/null; then
              grep -v -F "$HOST" "$KNOWN" > "${KNOWN}.tmp" || true
              mv -f "${KNOWN}.tmp" "$KNOWN"
            fi
            ssh-keyscan -T 5 -H "$HOST" >> "$KNOWN" || true
          args:
            executable: /bin/bash
      loop: "{{ groups['launched'] | default([]) }}"
      when: groups['launched'] is defined and groups['launched'] | length > 0

    - name: Wait for SSH
      wait_for:
        host: "{{ item }}"
        port: 22
        timeout: "{{ wait_for_ssh_timeout }}"
        state: started
      loop: "{{ groups['launched'] | default([]) }}"
      when: groups['launched'] is defined and groups['launched'] | length > 0

# second play installs apache (same as previous)
- name: Install Apache (Ubuntu)
  hosts: launched
  become: yes
  gather_facts: yes
  tasks:
    - name: Update apt and install apache
      apt:
        update_cache: yes
        name: apache2
        state: present

    - name: Ensure apache started
      service:
        name: apache2
        state: started
        enabled: yes

    - name: Create demo page
      copy:
        dest: /var/www/html/index.html
        content: |
          <h1>Apache deployed via Jenkins+Ansible</h1>
          <p>{{ inventory_hostname }}</p>
