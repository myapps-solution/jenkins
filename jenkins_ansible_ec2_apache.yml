---
- name: Create EC2 & Install Apache on Ubuntu
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    region: "us-east-1"
    ami_id: "ami-0e001c9271cf7f3b9"
    instance_type: "t3.micro"
    key_name: "Jenkins_master.pem"     # default; overridden from Jenkins
    ssh_user: "ubuntu"
    ec2_name: "jenkins-demo-ec2"
    sg_name: "jenkins-demo-sg"

  tasks:
    - name: Create security group
      amazon.aws.ec2_group:
        name: "{{ sg_name }}"
        description: "SG for Jenkins-Ansible Demo"
        region: "{{ region }}"
        rules:
          - proto: tcp
            from_port: 22
            to_port: 22
            cidr_ip: 0.0.0.0/0
          - proto: tcp
            from_port: 80
            to_port: 80
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg_out

    - name: Launch EC2 instance (Ubuntu)
      amazon.aws.ec2_instance:
        name: "{{ ec2_name }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        security_group: "{{ sg_out.group_id }}"
        region: "{{ region }}"
        wait: yes
        tags:
          Name: "{{ ec2_name }}"
      register: ec2_out

    - name: Debug - show created instances IDs and public IPs
      debug:
        msg:
          - "Created instance ids: {{ ec2_out.instances | map(attribute='id') | list }}"
          - "Created instance public IPs: {{ ec2_out.instances | map(attribute='public_ip_address') | list }}"

    - name: Save instance IP addresses to workspace file (instance_ips.txt)
      copy:
        dest: "./instance_ips.txt"
        content: |
          {% for ip in ec2_out.instances | map(attribute='public_ip_address') | list %}
          {{ ip }}
          {% endfor %}
      delegate_to: localhost
